[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxio"
version = "0.1.0"
description = "Durable, exactly-once serverless workflow orchestration for AWS Lambda — all regions, Python 3.10+"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya Ganti", email = "adi.ganti95@hotmail.com" }]
keywords = [
    "aws", "lambda", "sqs", "dynamodb", "workflow", "orchestration",
    "serverless", "distributed-systems", "exactly-once", "fan-in", "fan-out",
    "multi-region", "lambda-durable-functions-alternative"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff", "black", "moto[dynamodb,sqs]>=5.0"]

[project.urls]
Homepage = "https://github.com/AdityaAudi/fluxio"
"Bug Tracker" = "https://github.com/AdityaAudi/fluxio/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
